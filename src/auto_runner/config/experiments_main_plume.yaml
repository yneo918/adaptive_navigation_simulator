# Main-plume RIDGE_DOWN demonstrations: aperture sweep.
#
# Background
# ----------
# Pure-Python simulator (scripts/pure_sim/pure_sim.py) was used to
# pre-screen RIDGE_DOWN behavior on the Fukushima cesium-137 field from
# near the global peak (sim (502, -315) = 10.7 MBq/m^2). The original
# d=150-200 configurations (4 km cluster) produced **local wandering**
# (path/net ratio 4-10) rather than long-range plume descent.
#
# Large-aperture probes revealed an aperture trade-off:
#   d=200  (4 km)  : wandering, net 1-5 km
#   d=500  (10 km) : modest improvement, net 7 km
#   d=1000 (20 km) : long path (50 km) but still wandering (net 15 km)
#   d=2000 (40 km) : **straight long descent**, net 17-20 km, ratio 1.6-1.7
#
# Interpretation: when d >= plume width (~10-20 km), the 5-robot RIDGE_DOWN
# algorithm integrates the global plume gradient rather than chasing local
# micro-ridges. This is the central evidence for the paper's aperture
# trade-off thesis applied to RIDGE/TRENCH primitives.
#
# Configurations below test this on ROS sim with bounds-safe starts
# (all 5 robots stay within the cesium map). theta = 3*pi/4 (= 2.3562 rad,
# NW orientation) aligns the cluster +X local axis with the NW plume axis
# so g_hat_x measures the descent direction directly.

defaults:
  trajectory_sample_interval: 0.5
  max_steps: 10000
  time_limit_s: 9000
  plateau_window_steps: 2000
  plateau_eps: 0.3
  net_disp_eps: 2.0
  z_range_eps: 0.005
  stable_motion_window_steps: 500
  stable_motion_span_eps: 10.0
  oob_threshold: 0.05
  oob_window_steps: 500
  progress_every_steps: 500
  warmup_s: 5.0
  cooldown_s: 2.0

experiments:
  # ============================================================
  # Aperture sweep from same plateau-edge start
  # (FDNPP-centered: (-867, 731)  ~17 km NW of FDNPP, plateau end)
  # ============================================================

  # Reference: small aperture (paper baseline d) for direct comparison.
  # Pure-sim predicted local wandering (~4 km net displacement).
  - id: ML01_RIDGE_DOWN_d500_plateau
    mode: RIDGE_DOWN
    d: 500.0
    start: {x: -200.0, y: 400.0, theta: 2.3562}
    output_subdir: SPECIAL/MAIN_PLUME

  # Medium aperture (~ plume width / 2). Pure-sim: long path (50 km) but
  # still wandering (15 km net).
  - id: ML02_RIDGE_DOWN_d1000_plateau
    mode: RIDGE_DOWN
    d: 1000.0
    start: {x: -200.0, y: 400.0, theta: 2.3562}
    output_subdir: SPECIAL/MAIN_PLUME

  # ============================================================
  # Large aperture (>= plume width): straight long-range descent
  # Bounds-safe starts (start moved further NW so the 5-robot
  # footprint of d=2000 cluster fits inside the map).
  # ============================================================

  # FDNPP-centered: (-1500, 200), 27 km NW of peak, on plume axis.
  # Pure-sim: ~33 km path, 20 km net descent (ratio 1.7).
  - id: ML03_RIDGE_DOWN_d2000_plateau
    mode: RIDGE_DOWN
    d: 2000.0
    start: {x: -833.0, y: -131.0, theta: 2.3562}
    output_subdir: SPECIAL/MAIN_PLUME

  # FDNPP-centered: (-967, 231), 17 km NW of peak.
  # Pure-sim: 49 km path, 7 km net (wandering near peak).
  - id: ML04_RIDGE_DOWN_d1000_near_peak
    mode: RIDGE_DOWN
    d: 1000.0
    start: {x: -300.0, y: -100.0, theta: 2.3562}
    output_subdir: SPECIAL/MAIN_PLUME

  # FDNPP-centered: (-1500, 0), 27 km NW of peak.
  # Pure-sim: 28 km path, 17.7 km net (largest Δz=-0.12).
  - id: ML05_RIDGE_DOWN_d2000_near_peak
    mode: RIDGE_DOWN
    d: 2000.0
    start: {x: -833.0, y: -331.0, theta: 2.3562}
    output_subdir: SPECIAL/MAIN_PLUME
