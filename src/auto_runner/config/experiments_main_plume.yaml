# Main-plume RIDGE_DOWN: P1 on plume + cluster descends NW + all on land.
#
# Goal
# ----
# Demonstrate the cluster tracing the cesium-137 plume from near the
# FDNPP source (the true global maximum, partially obscured by the
# no-go-zone data gap) NW along the plume axis. The leader (P1) starts
# on the plume crest; the cluster autonomously descends along the
# ridge axis using 5-robot RIDGE_DOWN.
#
# Aperture choice (verified by pure_sim, 2026-05-20)
# --------------------------------------------------
# d=300 (6 km cluster) is the optimal aperture for this scenario:
#   - small enough that the entire cluster footprint stays inland
#     during the initial transient (the eastern wing of larger
#     clusters drifts offshore during cluster self-alignment).
#   - large enough that the 5-robot gradient sees the plume cleanly.
#
# Verified results (pure_sim, 20000 steps)
# ----------------------------------------
# MP01: 4.0 km NW descent along the plume axis, path 15.9 km,
#       0% offshore (max_raw_x=607, coast at 694, margin 1.7 km),
#       Δz_5robot = -0.06. Cluster descends from z@p1 ≈ 0.87 to ≈ 0.5.
# MP02: same start as MP01 with theta=0° — cluster self-aligns to
#       the same end position. Confirms theta-insensitivity.
# MP03: mid-plume start (r=20 km from peak), distinct off-axis
#       behavior — cluster descends laterally (35 km path, Δz=-0.31,
#       NW projection -16.8 km, but all on land). Kept as a
#       counter-example demonstrating how starting position relative
#       to the source determines whether RIDGE_DOWN traces the plume
#       axis or finds a lateral gradient.

defaults:
  trajectory_sample_interval: 0.5
  max_steps: 20000
  time_limit_s: 18000
  plateau_window_steps: 2000
  plateau_eps: 0.3
  net_disp_eps: 2.0
  z_range_eps: 0.005
  stable_motion_window_steps: 500
  stable_motion_span_eps: 5.0
  oob_threshold: 0.05
  oob_window_steps: 500
  progress_every_steps: 500
  warmup_s: 5.0
  cooldown_s: 2.0

experiments:
  # MP01 (primary): P1 8 km NW of FDNPP on plume crest, d=300, theta=-90°.
  # FDNPP-centered start (-488, +249). Raw sim (179, -82).
  # Pure_sim: 4.0 km NW descent, 0% offshore, 1.7 km coast margin.
  - id: MP01_RIDGE_DOWN_d300_source
    mode: RIDGE_DOWN
    d: 300.0
    start: {x: 179.0, y: -82.0, theta: -1.5708}   # theta = -90° (S heading)
    output_subdir: SPECIAL/MAIN_PLUME

  # MP02 (confirmation): same start as MP01, theta=0° (E heading).
  # Cluster self-aligns to the same end position — confirms RIDGE_DOWN
  # behavior is theta-insensitive near the plume crest.
  - id: MP02_RIDGE_DOWN_d300_theta0
    mode: RIDGE_DOWN
    d: 300.0
    start: {x: 179.0, y: -82.0, theta: 0.0}
    output_subdir: SPECIAL/MAIN_PLUME

  # MP03 (mid-plume, special case): P1 20 km NW of peak, theta=165°,
  # d=500 (larger aperture acceptable here — further from coast).
  # FDNPP-centered (-979, +594). Raw sim (-312, +263).
  # Pure_sim: distinct off-axis 35 km lateral descent, Δz=-0.31,
  # all robots stay on land. Demonstrates RIDGE_DOWN behavior when
  # the cluster is started off the source-proximity zone.
  - id: MP03_RIDGE_DOWN_d500_mid
    mode: RIDGE_DOWN
    d: 500.0
    start: {x: -312.0, y: 263.0, theta: 2.8798}   # theta = 165°
    output_subdir: SPECIAL/MAIN_PLUME
