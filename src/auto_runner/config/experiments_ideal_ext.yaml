    mode: MAX
    d: 150.0
    start: {x: -1500.0, y: 200.0, theta: 0.0}
    output_subdir: IDEAL_EXT/MAX
  - id: G04_MAX_d150
    mode: MAX
    d: 150.0
    start: {x: -200.0, y: 800.0, theta: 0.0}
    output_subdir: IDEAL_EXT/MAX
