    mode: RANDOM_WALK
    d: 150.0
    start: {x: -1950.0, y: 1263.0, theta: 0.0}
    random_walk_seed: 11
    output_subdir: BASELINE/RW/MAX
    # source: G01_MAX_d150 (MAX d=150.0), trial 1
