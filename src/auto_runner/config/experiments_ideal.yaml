# Ideal-condition per-mode performance evaluation (50 runs).
#
# Goal: showcase each AN primitive's best achievable performance with
# aperture matched to the local feature scale of the cesium-137 field
# and starting positions that permit ideal navigation.
#
# Aperture (d) is FIXED per mode (not swept). The "how to obtain such d
# in unknown environments" question is deferred to Future Work. Position
# selection uses terrain knowledge to give each mode a meaningful run.
#
# Per-mode plan: 10 runs x 5 modes = 50 runs.
#
# Termination per run (OR):
#   - max_steps reached (5000 default, 2x of best CT D1 ~2373 steps)
#   - convergence (leader position plateau, disabled for CROSSTRACK)
#   - out-of-area (ALL 5 robots have sensor z < 0.12 for >= 50 steps)
#   - time_limit_s (1800 s safety cap)
#
# Coordinate system:
#   sim origin: (37.480654N, 140.881685E), distance_scale=0.05
#   FDNPP sim:  (667.0, -331.1)
#   d (GUI units): d_real_m = d * 20

defaults:
  trajectory_sample_interval: 0.5  # matches past data (process_experiments.py)
  max_steps: 5000                  # 0.5s/step * 5000 = 2500s = 42 min
  time_limit_s: 4500               # 75 min safety cap (1.8x max_steps duration)

  # Convergence checks (OR-combined; all share plateau_window_steps).
  # Disabled when an experiment sets disable_plateau: true (CROSSTRACK).
  plateau_window_steps: 1000       # 0.5s/step * 1000 = 500 s
  plateau_eps: 0.5                 # (1) true stop: max(span_x, span_y) < eps
  net_disp_eps: 2.0                # (2) orbital trap: |pos[end]-pos[start]| < eps
                                   #     40 m real; survives oscillation around a max
  z_range_eps: 0.005               # (3) z_c saturation: max-min z_c < eps over window
  # z_range alone is satisfied when the cluster slides along an iso-contour
  # (constant z_c but still moving). Require recent position span to also
  # be small so we only terminate on a genuinely parked cluster.
  # (Path length is a poor discriminator: a cluster oscillating in place
  # accumulates path; we want the spatial extent of recent motion.)
  stable_motion_window_steps: 200  # last 100 s span check
  stable_motion_span_eps: 5.0      # 100 m bbox span in last 100 s

  # Out-of-area: sea / data-sparse / zero deposition zones
  oob_threshold: 0.12              # sensor z floor (~10^4 Bq/m^2)
  oob_window_steps: 500            # 0.5s/step * 500 = 250 s all-robots-out

  progress_every_steps: 200        # 0.5s/step * 200 = 100s between progress lines
  warmup_s: 5.0
  cooldown_s: 2.0

