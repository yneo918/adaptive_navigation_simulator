# Ideal-condition per-mode performance evaluation (50 runs).
#
# Goal: showcase each AN primitive's best achievable performance with
# aperture matched to the local feature scale of the cesium-137 field
# and starting positions that permit ideal navigation.
#
# Aperture (d) is FIXED per mode (not swept). The "how to obtain such d
# in unknown environments" question is deferred to Future Work. Position
# selection uses terrain knowledge to give each mode a meaningful run.
#
# Per-mode plan: 10 runs x 5 modes = 50 runs.
#
# Termination per run (OR):
#   - max_steps reached (5000 default, 2x of best CT D1 ~2373 steps)
#   - convergence (leader position plateau, disabled for CROSSTRACK)
#   - out-of-area (ALL 5 robots have sensor z < 0.12 for >= 50 steps)
#   - time_limit_s (1800 s safety cap)
#
# Coordinate system:
#   sim origin: (37.480654N, 140.881685E), distance_scale=0.05
#   FDNPP sim:  (667.0, -331.1)
#   d (GUI units): d_real_m = d * 20

defaults:
  trajectory_sample_interval: 5.0
  max_steps: 5000
  time_limit_s: 1800
  plateau_eps: 0.5
  plateau_window_steps: 200
  oob_threshold: 0.12              # sensor z floor (= ~10^4 Bq/m^2)
  oob_window_steps: 50             # ~250 s of all-robots-out
  warmup_s: 5.0
  cooldown_s: 2.0

