csv_sensor_field:
  ros__parameters:
    csv_path: data/radiation_field.csv
    frame_id: world
    interpret_latlon: true
    distance_unit: m
    column_x: latitude
    column_y: longitude
    column_data: radiation
    distance_scale: 0.01
    fill_rect_min: -240,0
    fill_rect_max: 100,500
    fill_method: thin_plate