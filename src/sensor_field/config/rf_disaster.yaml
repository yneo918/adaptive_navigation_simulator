csv_sensor_field:
  ros__parameters:
    csv_path: data/radiation_field.csv
    frame_id: world
    interpret_latlon: true
    distance_unit: m
    column_x: latitude
    column_y: longitude
    column_data: radiation
    distance_scale: 0.05
    fill_rect_min: -1600,600
    fill_rect_max: 240,3000
    fill_spacing: 1.0  # Augmentation point spacing in meters
    fill_method: thin_plate
    cache_dir: .sensor_field_cache  # Cache directory (git-ignored)
    enable_cache: true  # Enable caching for faster startup